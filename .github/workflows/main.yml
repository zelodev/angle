      - name: Get Angle
        uses: actions/checkout@main
        with:
          path: 'angle'
          fetch-depth: 1
          
      - name: Cache depot_tools
        id: cache-depot-tools
        uses: actions/cache@main
        with:
          path: depot_tools
          key: depot-tools-${{ runner.os }}-${{ hashFiles('.gclient') }}
          restore-keys: |
            depot-tools-${{ runner.os }}-
            
      - name: Get & Install depot_tools
        if: steps.cache-depot-tools.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf JAVA_HOME_8_X64
          sudo rm -rf JAVA_HOME_11_X64
          sudo rm -rf JAVA_HOME_17_X64
          sudo rm -rf JAVA_HOME_21_X64
          sudo rm -rf JAVA_HOME_25_X64
          sudo rm -rf /usr/share/miniconda
          sudo rm -rf /usr/local/share/vcpkg
          sudo rm -rf /usr/local/lib/android/sdk/ndk/27.3.13750724
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$GITHUB_WORKSPACE/depot_tools" >> $GITHUB_PATH
          echo $PATH

      - name: Cache ANGLE dependencies
        id: cache-deps
        uses: actions/cache@main
        with:
          path: |
            build/linux
            third_party/llvm-build
            third_party/rust-toolchain
            tools/glslang
            tools/flex-bison
          key: deps-${{ runner.os }}-${{ hashFiles('DEPS') }}
          restore-keys: |
            deps-${{ runner.os }}-
            
      - name: Setup Angle
        run: |
          export PATH=`pwd`/depot_tools:$PATH
          echo $PATH
          vpython3 scripts/bootstrap.py
          gclient sync --no-history --shallow --reset --force
          
      - name: ccache
        uses: hendrikmuhs/ccache-action@main
        with:
          key: angle-ccache
          max-size: 5G

      - name: Setup ccache path
        shell: bash
        run: |
         echo "$HOME/.local/bin" >> $GITHUB_PATH
         echo "/usr/lib/ccache" >> $GITHUB_PATH
         which ccache || echo "ccache not found"
         ccache --version

      - name: Make GN arg
        run: |
          export PATH=`pwd`/depot_tools:$PATH
          echo $PATH
          mkdir -p out/Android-${{matrix.arch}}
          touch out/Android-${{matrix.arch}}/args.gn
          
          echo "target_os = \"android\"
          target_cpu = \"arm64\"
          arm_control_flow_integrity = \"none\"
          use_thin_lto = true
          thin_lto_enable_optimizations = true
          is_component_build = false
          is_debug = false
          is_official_build = true
          angle_build_all = false
          android32_ndk_api_level = 29
          android64_ndk_api_level = 29
          build_angle_deqp_tests = false
          dcheck_always_on = false
          symbol_level = 0
          angle_enable_vulkan_validation_layers = false
          angle_enable_null = false
          angle_force_thread_safety = false
          angle_enable_vulkan = true
          generate_build_files = 0
          angle_expose_non_conformant_extensions_and_versions = true" >> out/Android-${{matrix.arch}}/args.gn

          gn gen out/Android-${{matrix.arch}} --threads=$(nproc)
          gn args out/Android-${{ matrix.arch }} --list --short

      - name: Build Angle (libraries)
        run: |
          autoninja -C out/Android-${{matrix.arch}} -j $(nproc)

      - name: Build Angle (apk)
        run: |
          autoninja -C out/Android-${{matrix.arch}} -j $(nproc) angle_apks

      - name: Upload Build Outputs
        uses: actions/upload-artifact@v4
        with:
          name: out-${{matrix.arch}}
          path: |
            angle/out/Android-${{matrix.arch}}
            
         
